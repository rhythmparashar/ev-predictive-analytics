name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint — critical errors only (syntax, undefined names)
        run: |
          flake8 battery_intelligence/ features/ ingestion/ monitoring/ evaluation/ \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      - name: Unit tests
        run: python -m pytest tests/unit/ -v --tb=short
